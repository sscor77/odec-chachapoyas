<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Web Responsive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">MiLogo</div>
      <button class="menu-toggle" aria-label="Abrir menú">&#9776;</button>
      <ul class="nav-links">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Acerca</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero">
      <h1>Bienvenido a mi web</h1>
      <p>Ejemplo de menú responsive con imágenes.</p>
      <img src="img/nosotros/nosotro.jpg" alt="Imagen de nosotros">
    </section>

    <!-- Galería -->
    <section class="galeria">
      <h2>Galería</h2>
      <div class="galeria-contenedor">
        <img src="img/galeria/galeria1.jpg" alt="Galería 1">
        <img src="img/galeria/galeria2.jpg" alt="Galería 2">
        <img src="img/galeria/galeria3.jpg" alt="Galería 3">
      </div>
    </section>

    <!-- Slider -->
    <section class="slider">
      <h2>Slider</h2>
      <div class="slider-contenedor">
        <img src="img/slider/slide1.jpg" alt="Slide 1">
        <img src="img/slider/slide2.jpg" alt="Slide 2">
        <img src="img/slider/slide3.jpg" alt="Slide 3">
      </div>
    </section>
  </main>

  <script>
    // Script para abrir/cerrar menú en móvil
    const toggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');

    toggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>
</body>
</html>
